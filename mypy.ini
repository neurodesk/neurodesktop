[mypy]
# The image's Python. The quality runner runs on host Python 3.10, so
# scripts/check_quality.py checks its RUNNER_HOST_TYPED_SCOPE separately.
python_version = 3.12
strict = True
# Unlisted modules are skipped, so every checked caller must be listed here.
# The T3 package's web and connect Jupyter adapters are not yet in scope.
follow_imports = skip
files =
    config/agents/opencode_update_config.py,
    config/agents/provider_security.py,
    extensions/t3-code-server/neurodesk_t3_code/__init__.py,
    extensions/t3-code-server/neurodesk_t3_code/naming.py,
    extensions/t3-code-server/neurodesk_t3_code/serverext.py,
    extensions/t3-code-server/neurodesk_t3_code/supervisor.py

# The T3 lifecycle adapter subclasses ExtensionApp. Follow only the typed
# packages that define it; requirements-quality.txt pins their versions.
[mypy-jupyter_server.extension.*,jupyter_core.*,traitlets.*]
follow_imports = normal
