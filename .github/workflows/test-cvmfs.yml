name: Test cvmfs

permissions:
  actions: write
  contents: read
  pull-requests: write
  issues: write

on:
  workflow_dispatch:
  schedule:
    - cron:  '0 17 * * *'
    
env:
  DOCKERHUB_ORG: ${{ secrets.DOCKERHUB_ORG }}

jobs:
  # Check the authoritative repository before fanning out to its replicas. If
  # the desired inventory is ahead of Stratum 0, every replica necessarily
  # reports the same omission and obscures the single publication failure.
  test_cvmfs_origin:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
    - name: check if the authoritative CVMFS repository is online and complete
      run: /bin/bash .github/workflows/test_cvmfs.sh stratum0.neurodesk.cloud.edu.au
  test_cvmfs_1_2_3:
    needs: test_cvmfs_origin
    env:
      CVMFS_INVENTORY_REPLICA_RETRY: "true"
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
    - name: check if cvmfs setup with multiple entries works
      run: /bin/bash .github/workflows/test_cvmfs_1_2_3.sh
  test_cvmfs:
    needs: test_cvmfs_origin
    env:
      CVMFS_INVENTORY_REPLICA_RETRY: "true"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cvmfs-servers: ["s1fnal-cvmfs.openhtc.io:8080",
                        "s1bnl-cvmfs.openhtc.io",
                        "s1osggoc-cvmfs.openhtc.io:8080",
                        "s1brisbane-cvmfs.openhtc.io",
                        "s1sydney-cvmfs.openhtc.io",
                        "s1melbourne-cvmfs.openhtc.io",
                        "s1perth-cvmfs.openhtc.io",
                        "cvmfs-frankfurt.neurodesk.org",
                        "cvmfs-jetstream.neurodesk.org",
                        "s1ral-cvmfs.openhtc.io",
                        "s1nikhef-cvmfs.openhtc.io",
                        "cvmfs-stratum-one.ihep.ac.cn:8000",
                        "s1sampa-cvmfs.openhtc.io:8080",
                        "cvmfs-geoproximity.neurodesk.org"]
                        # not yet active:
                          # "cvmfs-s1.hpc.swin.edu.au",
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
    - name: check if ${{ matrix.cvmfs-servers }} is online and up-to-date
      run: /bin/bash .github/workflows/test_cvmfs.sh  ${{ matrix.cvmfs-servers }}
