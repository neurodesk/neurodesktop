name: JupyterHub Notebook Testing (All instances)
on:
  schedule:
    - cron: '0 6 * * *'  # Run every 24 hours at 6 AM UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  issues: write

jobs:
  test-notebooks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # - server_name: "Neuro-Test CI VM"
          #   token_secret: "JUPYTER_CI_TEST_TOKEN"
          #   url_var: "JUPYTER_API_URL_CI_TEST"
          #   default_url: "https://neuro-test.ssdsorg.cloud.edu.au"
          #   user_var: "JUPYTER_TEST_USER"
          #   default_user: "akshitbeniwal"
          - server_name: "play-eu"
            token_secret: "JUPYTER_PLAY_EU_TOKEN"
            url_var: "JUPYTER_API_URL_PLAY_EU"
            default_url: "https://play-europe.neurodesk.org"
            user_var: "JUPYTER_TEST_USER"
            default_user: "akshitbeniwal"
          - server_name: "play-america"
            token_secret: "JUPYTER_PLAY_AMERICA_TOKEN"
            url_var: "JUPYTER_API_URL_PLAY_AMERICA"
            default_url: "https://play-america.neurodesk.org"
            user_var: "JUPYTER_TEST_USER"
            default_user: "akshitbeniwal"
          - server_name: "play-aus"
            token_secret: "JUPYTER_PLAY_AUS_TOKEN"
            url_var: "JUPYTER_API_URL_PLAY_AUS"
            default_url: "https://play.neurodesk.cloud.edu.au"
            user_var: "JUPYTER_TEST_USER_AUS"
            default_user: "aaf_ttacrdwkv3giggp5janknefwxscf9_dmbvilqynah0e"
          - server_name: "edu-neurodesk"
            token_secret: "JUPYTER_EDU_NEURODESK_TOKEN"
            url_var: "JUPYTER_API_URL_EDU_NEURODESK"
            default_url: "https://edu.neurodesk.org"
            user_var: "JUPYTER_TEST_USER"
            default_user: "akshitbeniwal"
    
    env:
      USER_TOKEN: ${{ secrets[matrix.token_secret] }}
      USER: ${{ vars[matrix.user_var] || matrix.default_user }}
      API_URL: ${{ vars[matrix.url_var] || matrix.default_url }}
      OUTPUT_NAME: "FSL_course_bet_test_output.ipynb"
      SERVER_START_SUCCEEDED: "false"
      SERVER_START_DIAGNOSTIC: "not-attempted"
      SERVER_STOP_SUCCEEDED: "false"
      NOTEBOOK_SUCCESS: "false"
    
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: "3.12"

    - name: Install Required Tools
      run: |
        echo "Installing required tools..."
        sudo apt-get update
        sudo apt-get install -y jq
        python -m pip install requests websocket-client

    - name: Setup Configuration
      run: |
        echo "=== JupyterHub Notebook Testing Started ==="
        echo "Server: ${{ matrix.server_name }}"
        echo "User: ${{ vars[matrix.user_var] || matrix.default_user }}"
        echo "API URL: ${{ vars[matrix.url_var] || matrix.default_url }}"
        echo "Output: $OUTPUT_NAME"

    - name: Start JupyterHub Server
      run: |
        echo "=== Starting JupyterHub Server ==="
        SERVER_API_URL="${API_URL}/hub/api/users/${USER}"
        SERVER_START_URL="${SERVER_API_URL}/server"
        REQUEST_PREFIX="gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.server_name }}"
        REQUEST_SEQUENCE=0
        RESPONSE_BODY=$(mktemp)
        RESPONSE_METRICS=$(mktemp)
        trap 'rm -f "$RESPONSE_BODY" "$RESPONSE_METRICS"' EXIT

        {
          echo "SERVER_START_SUCCEEDED=false"
          echo "SERVER_START_DIAGNOSTIC=not-attempted"
          echo "SERVER_STOP_SUCCEEDED=false"
          echo "NOTEBOOK_SUCCESS=false"
        } >> "$GITHUB_ENV"

        set_start_diagnostic() {
          echo "SERVER_START_DIAGNOSTIC=$1" >> "$GITHUB_ENV"
        }

        api_request() {
          local method="$1"
          local url="$2"
          local request_id
          local curl_rc

          REQUEST_SEQUENCE=$((REQUEST_SEQUENCE + 1))
          request_id="${REQUEST_PREFIX}-${REQUEST_SEQUENCE}"
          : > "$RESPONSE_BODY"
          : > "$RESPONSE_METRICS"

          echo "request_id=$request_id method=$method"
          if curl \
              --silent --show-error --fail-with-body \
              --connect-timeout 15 \
              --max-time 60 \
              --request "$method" \
              --header "Authorization: token $USER_TOKEN" \
              --header "X-Request-ID: $request_id" \
              --output "$RESPONSE_BODY" \
              --write-out 'http=%{http_code} remote_ip=%{remote_ip} dns=%{time_namelookup} tcp=%{time_connect} tls=%{time_appconnect} first_byte=%{time_starttransfer} total=%{time_total} curl_exit=%{exitcode}\n' \
              "$url" > "$RESPONSE_METRICS"; then
            curl_rc=0
          else
            curl_rc=$?
          fi

          cat "$RESPONSE_METRICS"
          return "$curl_rc"
        }

        parse_server_state() {
          if ! jq -e 'type == "object"' "$RESPONSE_BODY" >/dev/null; then
            echo "❌ JupyterHub returned invalid JSON"
            return 1
          fi

          SERVER_PATH=$(jq -r '.server // ""' "$RESPONSE_BODY")
          # The user model has no top-level "ready"; it lives in the nested
          # server model, so read it from there (issue #794).
          SERVER_READY=$(jq -r '.servers[""].ready // .ready // false' "$RESPONSE_BODY")
          SERVER_PENDING=$(jq -r '.pending // ""' "$RESPONSE_BODY")
        }

        fetch_server_state() {
          local attempts="${1:-1}"
          local attempt

          for attempt in $(seq 1 "$attempts"); do
            if api_request GET "$SERVER_API_URL" && parse_server_state; then
              return 0
            fi
            echo "⚠️ Unable to read server state (attempt $attempt/$attempts)"
            if [ "$attempt" -lt "$attempts" ]; then
              sleep $((attempt * 5))
            fi
          done
          return 1
        }

        reconcile_server_state() {
          if ! fetch_server_state 3; then
            return 1
          fi
          if [ "$SERVER_READY" = "true" ] || [ "$SERVER_PENDING" = "spawn" ] || [ -n "$SERVER_PATH" ]; then
            return 0
          fi
          return 2
        }

        echo "Checking current server state..."
        if ! fetch_server_state 3; then
          set_start_diagnostic "initial-state-request-failed"
          exit 1
        fi

        SHOULD_POST=true
        if [ "$SERVER_READY" = "true" ] && [ -n "$SERVER_PATH" ]; then
          echo "Server is already running; stopping it first..."
          api_request DELETE "$SERVER_START_URL" || true

          SERVER_STOPPED=false
          for i in {1..12}; do
            sleep 10
            if fetch_server_state && [ -z "$SERVER_PATH" ] && [ -z "$SERVER_PENDING" ]; then
              echo "✅ Existing server stopped successfully"
              SERVER_STOPPED=true
              break
            fi
            echo "Waiting for existing server to stop... (${i}0s elapsed)"
          done
          if [ "$SERVER_STOPPED" != "true" ]; then
            set_start_diagnostic "existing-server-stop-timeout"
            exit 1
          fi
        elif [ "$SERVER_PENDING" = "spawn" ]; then
          echo "Server is already starting; continuing to readiness polling"
          SHOULD_POST=false
        fi

        if [ "$SHOULD_POST" = "true" ]; then
          SPAWN_ACCEPTED=false
          for attempt in {1..3}; do
            echo "Starting server for $USER (attempt $attempt/3)..."
            if api_request POST "$SERVER_START_URL"; then
              echo "✅ Spawn request accepted"
              SPAWN_ACCEPTED=true
              break
            fi

            echo "⚠️ Spawn request failed; reconciling server state before retry"
            if reconcile_server_state; then
              echo "✅ Spawn is active despite the failed response; not retrying POST"
              SPAWN_ACCEPTED=true
              break
            else
              reconcile_rc=$?
            fi
            if [ "$reconcile_rc" -eq 1 ]; then
              echo "❌ Spawn response failed and server state is unknown; refusing an unsafe duplicate POST"
              set_start_diagnostic "spawn-failed-state-unknown"
              exit 1
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done

          if [ "$SPAWN_ACCEPTED" != "true" ]; then
            set_start_diagnostic "spawn-request-failed"
            exit 1
          fi
        fi

        echo "Waiting for server to start..."
        SERVER_STARTED=false

        for i in {1..24}; do
          sleep 10
          if ! fetch_server_state; then
            echo "Server-state request failed; continuing readiness polling (${i}0s elapsed)"
            continue
          fi

          if [ -n "$SERVER_PATH" ] && [ "$SERVER_READY" = "true" ] && [ -z "$SERVER_PENDING" ]; then
            echo "✅ Server started successfully (${i}0s elapsed)"
            SERVER_STARTED=true
            break
          elif [ "$SERVER_PENDING" = "spawn" ]; then
            echo "Server is still starting... (${i}0s elapsed)"
          else
            echo "Waiting for server to start... (${i}0s elapsed)"
          fi
        done

        if [ "$SERVER_STARTED" != true ]; then
          set_start_diagnostic "server-readiness-timeout"
          echo "❌ Server failed to start within timeout"
          exit 1
        fi

        {
          echo "SERVER_START_SUCCEEDED=true"
          echo "SERVER_START_DIAGNOSTIC=ready"
        } >> "$GITHUB_ENV"

        # Wait for server to fully initialize
        echo "Waiting for server to fully initialize..."
        sleep 15

    - name: Create and Execute FSL Notebook
      run: |
        python scripts/check_fsl_notebook.py \
          --server-url "$API_URL/user/$USER/" \
          --output-name "$OUTPUT_NAME" \
          --evidence-dir fsl-evidence
        echo "NOTEBOOK_SUCCESS=true" >> "$GITHUB_ENV"

    - name: Upload executed notebook evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: fsl-bet-${{ matrix.server_name }}
        path: fsl-evidence/
        if-no-files-found: ignore

    - name: Stop JupyterHub Server
      if: always()
      run: |
        echo "=== Stopping JupyterHub Server ==="
        SERVER_API_URL="${API_URL}/hub/api/users/${USER}"
        SERVER_START_URL="${SERVER_API_URL}/server"
        RESPONSE_BODY=$(mktemp)
        RESPONSE_METRICS=$(mktemp)
        trap 'rm -f "$RESPONSE_BODY" "$RESPONSE_METRICS"' EXIT

        api_request() {
          local method="$1"
          local url="$2"
          local curl_rc

          : > "$RESPONSE_BODY"
          : > "$RESPONSE_METRICS"
          if curl \
              --silent --show-error --fail-with-body \
              --connect-timeout 15 \
              --max-time 60 \
              --request "$method" \
              --header "Authorization: token $USER_TOKEN" \
              --header "X-Request-ID: gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.server_name }}-stop" \
              --output "$RESPONSE_BODY" \
              --write-out 'http=%{http_code} remote_ip=%{remote_ip} dns=%{time_namelookup} tcp=%{time_connect} tls=%{time_appconnect} first_byte=%{time_starttransfer} total=%{time_total} curl_exit=%{exitcode}\n' \
              "$url" > "$RESPONSE_METRICS"; then
            curl_rc=0
          else
            curl_rc=$?
          fi

          cat "$RESPONSE_METRICS"
          return "$curl_rc"
        }

        echo "Stopping server..."
        api_request DELETE "$SERVER_START_URL" || true
        
        echo "Waiting for server to stop..."
        SERVER_STOPPED=false
        for i in {1..12}; do
          sleep 10
          if ! api_request GET "$SERVER_API_URL"; then
            echo "Unable to read server state; retrying (${i}0s elapsed)"
            continue
          fi
          if ! jq -e 'type == "object"' "$RESPONSE_BODY" >/dev/null; then
            echo "JupyterHub returned invalid JSON; retrying (${i}0s elapsed)"
            continue
          fi

          SERVER_PATH=$(jq -r '.server // ""' "$RESPONSE_BODY")
          SERVER_PENDING=$(jq -r '.pending // ""' "$RESPONSE_BODY")
          if [ -z "$SERVER_PATH" ] && [ -z "$SERVER_PENDING" ]; then
            echo "✅ Server stopped successfully"
            SERVER_STOPPED=true
            break
          fi
          echo "Waiting for server to stop... (${i}0s elapsed)"
        done

        if [ "$SERVER_STOPPED" != "true" ]; then
          echo "❌ Server cleanup did not complete within timeout"
          exit 1
        fi
        echo "SERVER_STOP_SUCCEEDED=true" >> "$GITHUB_ENV"

    - name: Generate Test Report
      if: always()
      run: |
        echo "Server start: ${SERVER_START_SUCCEEDED:-false}"
        echo "Server stop: ${SERVER_STOP_SUCCEEDED:-false}"
        echo "Executed notebook and numerical BET validation: ${NOTEBOOK_SUCCESS:-false}"
        if [ "${SERVER_START_SUCCEEDED:-false}" != "true" ]; then
          echo "Primary diagnostic: ${SERVER_START_DIAGNOSTIC:-unknown}"
        fi
        test "${SERVER_START_SUCCEEDED:-false}" = "true"
        test "${SERVER_STOP_SUCCEEDED:-false}" = "true"
        test "${NOTEBOOK_SUCCESS:-false}" = "true"
