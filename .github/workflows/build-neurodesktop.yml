name: Build neurodesktop

# Scheduled production builds at 17:00 UTC every day.
# Build manually from here: https://github.com/NeuroDesk/neurodesktop/actions/workflows/build-neurodesktop.yml

# DockerHub: https://hub.docker.com/r/vnmd/neurodesktop
# Github Packages: https://github.com/NeuroDesk/neurodesktop/pkgs/container/neurodesktop%2Fneurodesktop

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
  packages: write

# Every production run writes the same architecture, dated, and latest tags.
# Serialize the whole workflow so overlapping dispatches cannot race while
# publishing those shared references.
concurrency:
  group: build-neurodesktop-publish
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      force_push:
        description: "Force push?"
        type: boolean
        required: true
        default: false
  schedule:
    - cron: "0 17 * * *"

env:
  DOCKERHUB_ORG: ${{ vars.DOCKERHUB_ORG }}
  QUAY_ORG: ${{ vars.QUAY_ORG }}

jobs:
  prepare-build:
    runs-on: ubuntu-24.04
    outputs:
      build_date: ${{ steps.metadata.outputs.build_date }}
    steps:
      - name: Choose build timestamp
        id: metadata
        run: echo "build_date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
  build-image:
    needs: prepare-build
    runs-on: ${{ matrix.platform.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - arch: amd64
            docker_platform: linux/amd64
            runs_on: ubuntu-24.04
          - arch: arm64
            docker_platform: linux/arm64
            runs_on: blacksmith-8vcpu-ubuntu-2404-arm
    steps:
      - name: Fetch github api rate limit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GITHUB_RATE_REMAINING=$(curl -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github.v3+json" https://api.github.com/rate_limit | jq '.rate.remaining')
          echo "GITHUB_RATE_REMAINING=${GITHUB_RATE_REMAINING}"
          case "$GITHUB_RATE_REMAINING" in
            ''|null|0)
              echo "::error::GitHub API rate limit probe returned '${GITHUB_RATE_REMAINING:-<empty>}'. Failing job to avoid running with unset IMAGEID/BUILDDATE."
              exit 1
              ;;
          esac
          echo "GITHUB_RATE_REMAINING=$GITHUB_RATE_REMAINING" >> "$GITHUB_ENV"
      - name: Configure runner
        if: matrix.platform.arch == 'amd64'
        run: |
          sudo mkdir -p /mnt/tmp
          sudo chown "$USER" /mnt/tmp
          sudo mkdir -p /mnt/docker
          echo '{"data-root": "/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
      - name: Set environment variables
        run: |
          IMAGENAME="neurodesktop"
          BUILDDATE="${{ needs.prepare-build.outputs.build_date }}"
          # GHCR path = owner + image name (ghcr.io/neurodesk/neurodesktop),
          # matching the Quay/DockerHub style. Previously $GITHUB_REPOSITORY
          # (org/repo) made it ghcr.io/neurodesk/neurodesktop/neurodesktop.
          IMAGEID="ghcr.io/${GITHUB_REPOSITORY_OWNER}/${IMAGENAME}"
          IMAGEID=$(echo "$IMAGEID" | tr '[:upper:]' '[:lower:]')

          echo "BUILDDATE=$BUILDDATE"
          echo "IMAGEID=$IMAGEID"
          echo "IMAGENAME=$IMAGENAME"

          {
            echo "BUILDDATE=$BUILDDATE"
            echo "IMAGEID=$IMAGEID"
            echo "IMAGENAME=$IMAGENAME"
          } >> "$GITHUB_ENV"
      - name: Resolve neurocommand ref
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEUROCOMMAND_REF=$(curl -fsSL \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 15 \
            --max-time 60 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/neurodesk/neurocommand/git/refs/heads/main \
            | jq -r '.object.sha // empty')
          if ! [[ "$NEUROCOMMAND_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve neurodesk/neurocommand main SHA."
            exit 1
          fi
          echo "NEUROCOMMAND_REF=$NEUROCOMMAND_REF"
          echo "NEUROCOMMAND_REF=$NEUROCOMMAND_REF" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Login to GHCR
        uses: ./.github/actions/docker-login-retry
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push arch image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          platforms: ${{ matrix.platform.docker_platform }}
          provenance: false
          push: true
          tags: ${{ env.IMAGEID }}:run-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform.arch }}
          build-args: |
            NEURODESKTOP_VERSION=${{ env.BUILDDATE }}
            VCS_REF=${{ github.sha }}
            NEUROCOMMAND_REF=${{ env.NEUROCOMMAND_REF }}
          cache-from: type=registry,ref=${{ env.IMAGEID }}:latest
          cache-to: type=inline
  merge-manifests:
    needs: [prepare-build, build-image, test-image, scan-image]
    runs-on: ubuntu-24.04
    steps:
      - name: Set environment variables
        run: |
          IMAGENAME="neurodesktop"
          BUILDDATE="${{ needs.prepare-build.outputs.build_date }}"
          # GHCR path = owner + image name (ghcr.io/neurodesk/neurodesktop),
          # matching the Quay/DockerHub style. Previously $GITHUB_REPOSITORY
          # (org/repo) made it ghcr.io/neurodesk/neurodesktop/neurodesktop.
          IMAGEID="ghcr.io/${GITHUB_REPOSITORY_OWNER}/${IMAGENAME}"
          IMAGEID=$(echo "$IMAGEID" | tr '[:upper:]' '[:lower:]')

          {
            echo "BUILDDATE=$BUILDDATE"
            echo "IMAGEID=$IMAGEID"
            echo "IMAGENAME=$IMAGENAME"
          } >> "$GITHUB_ENV"
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Login to GHCR
        uses: ./.github/actions/docker-login-retry
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to DockerHub
        if: ${{ env.DOCKERHUB_ORG != '' }}
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      # Quay is a backup mirror; GHCR remains the production registry. The
      # neurodesktop repo is canonical for the `neurodesktop` name, so this
      # build owns quay.io/${QUAY_ORG}/neurodesktop, including `:latest`.
      # QUAY_ORG (a repo variable) is both the namespace and the on/off switch,
      # mirroring DOCKERHUB_ORG — forks without it set simply skip Quay.
      - name: Login to Quay
        if: ${{ env.QUAY_ORG != '' }}
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}
      - name: Promote validated architecture images
        run: |
          for arch in amd64 arm64; do
            docker buildx imagetools create --prefer-index=false \
              -t "$IMAGEID:$arch" \
              "$IMAGEID:run-${{ github.run_id }}-${{ github.run_attempt }}-$arch"
          done
      - name: Create and push multi-arch manifest to GHCR
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGEID }}:${{ env.BUILDDATE }} \
            -t ${{ env.IMAGEID }}:latest \
            ${{ env.IMAGEID }}:run-${{ github.run_id }}-${{ github.run_attempt }}-amd64 \
            ${{ env.IMAGEID }}:run-${{ github.run_id }}-${{ github.run_attempt }}-arm64
      - name: Install crane
        if: ${{ (env.DOCKERHUB_ORG != '' || env.QUAY_ORG != '') }}
        run: |
          curl -sL https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz \
            | sudo tar -xz -C /usr/local/bin crane
          crane version
      - name: Copy dated multi-arch manifest to DockerHub
        if: ${{ env.DOCKERHUB_ORG != '' }}
        uses: ./.github/actions/crane-copy-retry
        with:
          source: ${{ env.IMAGEID }}:${{ env.BUILDDATE }}
          destination: ${{ env.DOCKERHUB_ORG }}/${{ env.IMAGENAME }}:${{ env.BUILDDATE }}
      - name: Copy latest multi-arch manifest to DockerHub
        if: ${{ env.DOCKERHUB_ORG != '' }}
        uses: ./.github/actions/crane-copy-retry
        with:
          source: ${{ env.IMAGEID }}:latest
          destination: ${{ env.DOCKERHUB_ORG }}/${{ env.IMAGENAME }}:latest
      - name: Copy dated multi-arch manifest to Quay
        if: ${{ env.QUAY_ORG != '' }}
        uses: ./.github/actions/crane-copy-retry
        with:
          source: ${{ env.IMAGEID }}:${{ env.BUILDDATE }}
          destination: quay.io/${{ env.QUAY_ORG }}/${{ env.IMAGENAME }}:${{ env.BUILDDATE }}
      - name: Copy latest multi-arch manifest to Quay
        if: ${{ env.QUAY_ORG != '' }}
        uses: ./.github/actions/crane-copy-retry
        with:
          source: ${{ env.IMAGEID }}:latest
          destination: quay.io/${{ env.QUAY_ORG }}/${{ env.IMAGENAME }}:latest
      - name: Create github tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          tag_path="tags/${BUILDDATE}"
          set +e
          lookup_output=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/git/ref/${tag_path}" \
            --jq '.object.sha' 2>&1)
          lookup_rc=$?
          set -e

          if [ "$lookup_rc" -eq 0 ]; then
            if [ "$lookup_output" = "$GITHUB_SHA" ]; then
              echo "Tag ${BUILDDATE} already points to ${GITHUB_SHA}."
            else
              echo "Updating tag ${BUILDDATE} from ${lookup_output} to ${GITHUB_SHA}."
              gh api --method PATCH \
                -H "Accept: application/vnd.github+json" \
                "/repos/${GITHUB_REPOSITORY}/git/refs/${tag_path}" \
                -f sha="${GITHUB_SHA}" \
                -F force=true
            fi
          elif grep -Eq '\(HTTP 404\)|"status"[[:space:]]*:[[:space:]]*"?404"?' <<<"$lookup_output"; then
            echo "Creating tag ${BUILDDATE} at ${GITHUB_SHA}."
            gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${BUILDDATE}" \
              -f sha="${GITHUB_SHA}"
          else
            printf '%s\n' "$lookup_output" >&2
            exit "$lookup_rc"
          fi
      - name: Write image publish summary
        run: |
          REGISTRIES="GHCR"
          [ "${{ env.DOCKERHUB_ORG }}" != "" ] && REGISTRIES="${REGISTRIES}, DockerHub"
          [ "${{ env.QUAY_ORG }}" != "" ] && REGISTRIES="${REGISTRIES}, Quay"
          RESULT="Validated and published to ${REGISTRIES}."

          {
            echo "## Image publish summary"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Result | ${RESULT} |"
            echo "| Version | \`${{ env.BUILDDATE }}\` |"
            echo "| Source commit | \`${GITHUB_SHA}\` |"
            echo "| GHCR image | \`${{ env.IMAGEID }}:${{ env.BUILDDATE }}\`, \`${{ env.IMAGEID }}:latest\` |"
            if [ "${{ env.QUAY_ORG }}" != "" ]; then
              echo "| Quay image | \`quay.io/${{ env.QUAY_ORG }}/${{ env.IMAGENAME }}:${{ env.BUILDDATE }}\`, \`quay.io/${{ env.QUAY_ORG }}/${{ env.IMAGENAME }}:latest\` |"
            else
              echo "| Quay image | Not configured; \`QUAY_ORG\` is empty. |"
            fi
            if [ "${{ env.DOCKERHUB_ORG }}" != "" ]; then
              echo "| DockerHub image | \`${{ env.DOCKERHUB_ORG }}/${{ env.IMAGENAME }}:${{ env.BUILDDATE }}\`, \`${{ env.DOCKERHUB_ORG }}/${{ env.IMAGENAME }}:latest\` |"
            else
              echo "| DockerHub image | Not configured; \`DOCKERHUB_ORG\` is empty. |"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
  test-image:
    name: test-image (${{ matrix.arch }} / ${{ matrix.profile.test_profile }})
    needs: build-image
    # arm64 tests RUN the container, so they need a native arm64 runner
    # (Blacksmith); amd64 stays on the GitHub-hosted runner.
    runs-on: ${{ matrix.arch == 'arm64' && 'blacksmith-8vcpu-ubuntu-2404-arm' || 'ubuntu-22.04' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        profile:
          - test_profile: "CVMFS enabled, sudo disabled"
            cvmfs_disable: "false"
            grant_sudo: "no"
            needs_cvmfs: true
          - test_profile: "CVMFS enabled, sudo enabled"
            cvmfs_disable: "false"
            grant_sudo: "yes"
            needs_cvmfs: true
          - test_profile: "CVMFS disabled, sudo disabled"
            cvmfs_disable: "true"
            grant_sudo: "no"
            needs_cvmfs: false
          - test_profile: "CVMFS disabled, sudo enabled"
            cvmfs_disable: "true"
            grant_sudo: "yes"
            needs_cvmfs: false
          - test_profile: "CVMFS disabled, package-only sudo"
            cvmfs_disable: "true"
            grant_sudo: "packages"
            needs_cvmfs: false
          # HPC Apptainer simulation: no --privileged, no --user=root, no sudo,
          # a non-jovyan user (sciget/5000/5000) whose HOME is bind-mounted over
          # /home/jovyan, and APPTAINER_CONTAINER=1 so is_apptainer_runtime()
          # branches activate. Guards against HPC-only regressions that would
          # otherwise only surface on Sherlock et al.
          - test_profile: "HPC Apptainer simulation"
            cvmfs_disable: "true"
            grant_sudo: "no"
            needs_cvmfs: false
            hpc_mode: true
        exclude:
          # arm64 + CVMFS deferred: the arm64 CVMFS tool library is mid-port
          # upstream and the arch-aware CVMFS routing (variant symlinks) isn't
          # wired yet, so /cvmfs/neurodesk.ardc.edu.au doesn't mount on the arm64
          # runner. Re-enable these 2 combos once arm64 CVMFS content + routing
          # land. amd64 keeps full CVMFS coverage.
          - arch: arm64
            profile:
              test_profile: "CVMFS enabled, sudo disabled"
              cvmfs_disable: "false"
              grant_sudo: "no"
              needs_cvmfs: true
          - arch: arm64
            profile:
              test_profile: "CVMFS enabled, sudo enabled"
              cvmfs_disable: "false"
              grant_sudo: "yes"
              needs_cvmfs: true
    steps:
      - name: Set environment variables
        run: |
          IMAGENAME="neurodesktop"
          # GHCR path = owner + image name (e.g. ghcr.io/neurodesk/neurodesktop-test),
          # matching the clean Quay/DockerHub style. Previously this used
          # $GITHUB_REPOSITORY (org/repo), which doubled the name to
          # ghcr.io/neurodesk/neurodesktop/neurodesktop-test.
          IMAGEID="ghcr.io/${GITHUB_REPOSITORY_OWNER}/${IMAGENAME}"
          IMAGEID=$(echo "$IMAGEID" | tr '[:upper:]' '[:lower:]')
          echo "IMAGEID=$IMAGEID" >> "$GITHUB_ENV"
          # Pull the per-arch tag matching this job's arch.
          echo "IMAGE_REF=$IMAGEID:run-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}" >> "$GITHUB_ENV"
      - name: Free up build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/lib/android-sdk || true
          sudo docker image prune --all --force || true
          sudo docker builder prune --force || true
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
      - name: Login to GHCR
        uses: ./.github/actions/docker-login-retry
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull container image
        run: bash scripts/retry.sh docker pull "$IMAGE_REF"
      - name: Initialize CVMFS
        if: matrix.profile.needs_cvmfs
        uses: cvmfs-contrib/github-action-cvmfs@10197e000cc0add8e54ac4fb73d3ed44e2de72b4 # v5.5
      - name: Configure Neurodesk CVMFS
        if: matrix.profile.needs_cvmfs
        run: |
          sudo mkdir -p /etc/cvmfs/keys/ardc.edu.au
          sudo cp config/cvmfs/neurodesk.ardc.edu.au.pub /etc/cvmfs/keys/ardc.edu.au/neurodesk.ardc.edu.au.pub
          sudo cp config/cvmfs/neurodesk.ardc.edu.au.conf /etc/cvmfs/config.d/neurodesk.ardc.edu.au.conf
          sudo cp config/cvmfs/default.local /etc/cvmfs/default.local
          sudo cvmfs_config setup
          sudo ls /cvmfs/neurodesk.ardc.edu.au
      - name: Test container (CVMFS=${{ matrix.profile.cvmfs_disable == 'false' && 'on' || 'off' }}, SUDO=${{ matrix.profile.grant_sudo }})
        if: ${{ ! matrix.profile.hpc_mode }}
        run: |
          source .github/scripts/image_test_cleanup.sh
          docker_args=()
          if [ "${{ matrix.profile.needs_cvmfs }}" = "true" ]; then
            docker_args=(-v /cvmfs:/cvmfs:shared)
          fi
          docker rm -f neurodesktop-test 2>/dev/null || true
          docker run -d --shm-size=1gb --privileged --user=root \
            --name neurodesktop-test \
            "${docker_args[@]}" \
            -e "CVMFS_DISABLE=${{ matrix.profile.cvmfs_disable }}" \
            -e "GRANT_SUDO=${{ matrix.profile.grant_sudo }}" \
            -e NEURODESKTOP_CVMFS_STARTUP_MODE=eager \
            -e NB_UID="$(id -u)" -e NB_GID="$(id -g)" \
            "$IMAGE_REF"
          echo "Waiting for container startup..."
          for i in $(seq 1 60); do
            code=$(docker exec neurodesktop-test curl -so /dev/null -w '%{http_code}' \
                     --max-time 2 http://localhost:8888/api/status 2>/dev/null || echo 000)
            if echo "$code" | grep -Eq '^[0-9]{3}$' && [ "$code" != "000" ]; then
              echo "Container ready after ~$((i*2))s (HTTP ${code})"
              break
            fi
            sleep 2
          done
          if [ "${{ matrix.profile.grant_sudo }}" = "packages" ]; then
            docker exec -u root neurodesktop-test pytest /opt/tests/test_security_policy.py -v
          fi
          docker exec -e NEURODESKTOP_TEST_ALLOW_GLOBAL_DESKTOP_SERVICES=1 \
            -u jovyan neurodesktop-test pytest /opt/tests/ -v

      - name: Test container (HPC Apptainer simulation)
        if: ${{ matrix.profile.hpc_mode }}
        run: |
          source .github/scripts/image_test_cleanup.sh
          # Mirror the `hpctest` mode of build_and_run.sh: non-root, non-jovyan
          # user with a synthetic /etc/passwd + /etc/group bind-mount, HOME on a
          # host-owned tempdir over /home/jovyan, APPTAINER_CONTAINER=1.
          HPC_USER=sciget
          HPC_UID=5000
          HPC_GID=5000
          HPC_HOME_DIR="$(mktemp -d)"
          HPC_PASSWD_FILE="$(mktemp)"
          HPC_GROUP_FILE="$(mktemp)"

          cat > "$HPC_PASSWD_FILE" <<EOF
          root:x:0:0:root:/root:/bin/bash
          jovyan:x:1000:100:jovyan:/home/jovyan:/bin/bash
          ${HPC_USER}:x:${HPC_UID}:${HPC_GID}:${HPC_USER} (HPC simulated):/home/jovyan:/bin/bash
          nobody:x:65534:65534:nobody:/:/usr/sbin/nologin
          EOF
          cat > "$HPC_GROUP_FILE" <<EOF
          root:x:0:
          users:x:100:jovyan,${HPC_USER}
          ${HPC_USER}:x:${HPC_GID}:
          nogroup:x:65534:
          EOF
          chmod 0777 "$HPC_HOME_DIR"
          chmod 0644 "$HPC_PASSWD_FILE" "$HPC_GROUP_FILE"

          docker rm -f neurodesktop-test 2>/dev/null || true
          docker run -d --shm-size=1gb \
            --user "${HPC_UID}:${HPC_GID}" \
            --name neurodesktop-test \
            -v "${HPC_HOME_DIR}:/home/jovyan" \
            -v "${HPC_PASSWD_FILE}:/etc/passwd:ro" \
            -v "${HPC_GROUP_FILE}:/etc/group:ro" \
            -e CVMFS_DISABLE=true \
            -e "NB_USER=${HPC_USER}" \
            -e "NB_UID=${HPC_UID}" \
            -e "NB_GID=${HPC_GID}" \
            -e HOME=/home/jovyan \
            -e "USER=${HPC_USER}" \
            -e "LOGNAME=${HPC_USER}" \
            -e APPTAINER_CONTAINER=1 \
            -e APPTAINER_NAME=neurodesktop-test-hpc \
            -e NEURODESKTOP_CVMFS_STARTUP_MODE=lazy \
            -e NEURODESKTOP_SLURM_ENABLE=0 \
            -e NEURODESKTOP_SLURM_STARTUP_MODE=eager \
            "$IMAGE_REF"
          echo "Waiting for container startup..."
          ready=0
          for i in $(seq 1 90); do
            if ! docker inspect -f '{{.State.Running}}' neurodesktop-test 2>/dev/null | grep -q true; then
              echo "::error::Container exited during startup (HPC mode)."
              docker logs --tail 120 neurodesktop-test || true
              exit 1
            fi
            code=$(docker exec neurodesktop-test curl -so /dev/null -w '%{http_code}' \
                     --max-time 2 http://localhost:8888/api/status 2>/dev/null || echo 000)
            if echo "$code" | grep -Eq '^[0-9]{3}$' && [ "$code" != "000" ]; then
              echo "Container ready after ~$((i*2))s (HTTP ${code})"
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::Container did not reach /api/status in 180s (HPC mode)."
            docker logs --tail 120 neurodesktop-test || true
            exit 1
          fi
          # Exec as the current container user (no -u jovyan: we are sciget here).
          docker exec -e NEURODESKTOP_TEST_ALLOW_GLOBAL_DESKTOP_SERVICES=1 \
            neurodesktop-test pytest /opt/tests/ -v

  scan-image:
    needs: build-image
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Set environment variables
        run: |
          IMAGENAME="neurodesktop"
          # GHCR path = owner + image name (ghcr.io/neurodesk/neurodesktop),
          # matching the Quay/DockerHub style. Previously $GITHUB_REPOSITORY
          # (org/repo) made it ghcr.io/neurodesk/neurodesktop/neurodesktop.
          IMAGEID="ghcr.io/${GITHUB_REPOSITORY_OWNER}/${IMAGENAME}"
          IMAGEID=$(echo "$IMAGEID" | tr '[:upper:]' '[:lower:]')
          echo "IMAGEID=$IMAGEID" >> "$GITHUB_ENV"
      - name: Free up build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/lib/android-sdk
          sudo docker image prune --all --force
          sudo docker builder prune --force
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
      - name: Login to GHCR
        uses: ./.github/actions/docker-login-retry
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull container image
        run: bash scripts/retry.sh docker pull "$IMAGEID:run-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}"
      - name: Container image scan (${{ matrix.arch }})
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGEID }}:run-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          format: table
          exit-code: "1"
          severity: CRITICAL
          trivyignores: ./.trivyignore.yaml
          timeout: 25m0s
          skip-files: /opt/rclone-v1.60.1-linux-amd64/README.txt,/opt/rclone-v1.60.1-linux-amd64/README.html,/opt/rclone-v1.60.1-linux-amd64/rclone.1,/opt/code-server/lib/vscode/package.json,/opt/code-server/lib/vscode/extensions/handlebars/package.json
