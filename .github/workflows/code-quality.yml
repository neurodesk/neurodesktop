---
name: Code quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout run revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-quality.txt
      - name: Install pinned Python tools
        run: python -m pip install -r requirements-quality.txt
      - name: Check Python
        run: bash scripts/check_quality.sh python

  shell-workflows-format:
    name: Shell, workflows and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout run revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-quality.txt
      - name: Install pinned quality tools
        run: |
          python -m pip install -r requirements-quality.txt
          bash scripts/install_quality_tools.sh "$RUNNER_TEMP/quality-bin"
          echo "$RUNNER_TEMP/quality-bin" >> "$GITHUB_PATH"
      - name: Check shell scripts
        run: bash scripts/check_quality.sh shell
      - name: Check workflow definitions
        run: bash scripts/check_quality.sh workflow
      - name: Check adopted formatting scope
        run: bash scripts/check_quality.sh format

  javascript:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout run revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Check handwritten JavaScript
        run: bash scripts/check_quality.sh javascript

  frontend:
    name: Frontend types and promises
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout run revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: extensions/neurodesk-launcher/package-lock.json
      - name: Install locked frontend tools
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: extensions/neurodesk-launcher
      - name: Check frontend
        run: bash scripts/check_quality.sh frontend

  docker:
    name: Dockerfile checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout run revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Check Dockerfile
        run: bash scripts/check_quality.sh docker
