name: Agentic runner readiness

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neurodesktop-codex-subscription
  cancel-in-progress: false
  queue: max

jobs:
  labels:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Ensure operational and review labels exist
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            for (const [name, color] of [
              ['agentic-operations', 'b60205'], ['agentic-workflow', '5319e7'],
              ['agentic-approved', '0e8a16'], ['agentic-ignore', 'eeeeee']
            ]) {
              try {
                await github.rest.issues.getLabel({ ...context.repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ ...context.repo, name, color });
              }
            }
  readiness:
    needs: labels
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ vars.AGENTIC_RUNNER || 'neurodesk-syd-arcrunner-neurodesktop' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Stage trusted controller and locked build inputs
        run: >-
          python3 .github/scripts/agentic_worker.py stage
          --workspace "$GITHUB_WORKSPACE"
          --directory "$RUNNER_TEMP/agentic-control"
      - name: Build worker image
        id: build_worker
        run: >-
          docker build --tag neurodesktop-agentic:codex-0.153.4
          --build-arg WORKER_UID="$(id -u)" --build-arg WORKER_GID="$(id -g)"
          "$RUNNER_TEMP/agentic-control/config/agentic"
      - name: Check real mounts and sandbox with dummy credentials
        run: python3 .github/scripts/check_agentic_sandbox.py
      - name: Validate an unchanged checkout without credentials or network
        run: >-
          python3 .github/scripts/agentic_worker.py canary
          --workspace "$GITHUB_WORKSPACE"
          --control "$RUNNER_TEMP/agentic-control/config/agentic"
          --directory "$RUNNER_TEMP/agentic-canary"
      - name: Stop canary container after completion or cancellation
        if: always()
        run: >-
          python3 "$RUNNER_TEMP/agentic-control/.github/scripts/agentic_worker.py" cleanup
          --directory "$RUNNER_TEMP/agentic-canary"
      - name: Save checkout validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agentic-readiness-validation
          path: ${{ runner.temp }}/agentic-canary/canary-validation.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Check persistent login without displaying credentials or calling a model
        if: ${{ !cancelled() && steps.build_worker.outcome == 'success' }}
        env:
          AGENTIC_CODEX_HOME: ${{ vars.AGENTIC_CODEX_HOME || '/var/lib/neurodesktop-codex' }}
        run: python3 .github/scripts/check_agentic_readiness.py
