---
name: Unit tests

# The tests under tests/unit/ assert on repository sources, importable Python
# modules, and shell scripts driven against a temporary HOME. None of them needs
# the built image, so they run here on every push and pull request instead of
# five times over inside the container matrix of the build workflows.
#
# Everything that does need a running container lives in tests/container/ and is
# executed as `pytest /opt/tests/` by the build workflows.

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Checkout unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.15"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install test dependencies
        run: |
          # httpx: imported by config/jupyter/webapp_wrapper/webapp_wrapper.py
          # traitlets: imported by the real Jupyter config template
          # ASTRA/anywidget: exercise the released-schema viewer adapter and
          # widget. Optional for a plain checkout (test_astra_view_graph.py
          # skips without them), installed here so CI always covers them.
          python -m pip install --upgrade pip
          # jupyter-server: exercise the astra.yaml file-browser server
          # extension (test_astra_view_filebrowser.py skips without it)
          # Install the local viewer project so its package metadata remains
          # the single source for the exact ASTRA/anywidget dependency pins.
          python -m pip install pytest httpx traitlets \
            jupyter-server jupyterhub==6.0.1 requests ipykernel websocket-client nibabel numpy ./extensions/t3-code-server ./extensions/astra-viewer
          # ssh-keygen and ACLs for SSH permission tests, jq for terminal tests
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-client acl jq gcc libx11-dev xvfb x11-xserver-utils

      - name: Run unit tests
        env:
          NEURODESKTOP_LAUNCHER_TEST_NODE_MODULES: ${{ runner.temp }}/launcher-dom/node_modules
        run: |
          npm ci --prefix tools/javascript-lint --ignore-scripts --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/launcher-dom" --no-audit --no-fund jsdom@26.1.0 typescript@5.9.3 esbuild@0.28.2 @jupyterlab/docregistry@4.6.4 @jupyterlab/coreutils@6.6.4 @jupyterlab/services@7.6.4 @lumino/widgets@2.10.0
          pytest tests/unit -v

  worker-validation:
    name: Offline worker validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout run revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Stage trusted controller and locked build inputs
        run: >-
          python3 .github/scripts/agentic_worker.py stage
          --workspace "$GITHUB_WORKSPACE"
          --directory "$RUNNER_TEMP/agentic-control"
      - name: Build worker image
        run: >-
          docker build --tag neurodesktop-agentic:codex-0.162.1
          --build-arg WORKER_UID="$(id -u)" --build-arg WORKER_GID="$(id -g)"
          "$RUNNER_TEMP/agentic-control/config/agentic"
      - name: Validate an unchanged checkout without credentials or network
        run: >-
          python3 .github/scripts/agentic_worker.py canary
          --workspace "$GITHUB_WORKSPACE"
          --control "$RUNNER_TEMP/agentic-control/config/agentic"
          --directory "$RUNNER_TEMP/agentic-canary"
      - name: Stop canary container after completion or cancellation
        if: always()
        run: >-
          python3 "$RUNNER_TEMP/agentic-control/.github/scripts/agentic_worker.py" cleanup
          --directory "$RUNNER_TEMP/agentic-canary"
      - name: Save checkout validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-worker-validation
          path: ${{ runner.temp }}/agentic-canary/canary-validation.txt
          if-no-files-found: ignore
          retention-days: 7

  unit-tests-required:
    name: pytest tests/unit
    needs: [unit-tests, worker-validation]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require both checkout and offline worker validation
        env:
          CHECKOUT_RESULT: ${{ needs.unit-tests.result }}
          WORKER_RESULT: ${{ needs.worker-validation.result }}
        run: |
          [[ "$CHECKOUT_RESULT" == success && "$WORKER_RESULT" == success ]]
