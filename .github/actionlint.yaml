self-hosted-runner:
  labels:
    - neurodesk-syd-arcrunner-neurodesktop

config-variables: null

paths:
  .github/workflows/issue-investigator.lock.yml:
    ignore:
      # gh-aw v0.80.9 emits the model map inside a single-quoted generated
      # shell string; the GitHub expression is consumed by Actions, not shell.
      - 'shellcheck reported issue in this script: SC2016'
      - 'unknown permission scope "copilot-requests"'
      - 'unexpected key "queue" for "concurrency" section'
  .github/workflows/issue-fixer.lock.yml:
    ignore:
      # Same gh-aw v0.80.9 generated constructs as issue-investigator.
      - 'shellcheck reported issue in this script: SC2016'
      - 'unknown permission scope "copilot-requests"'
      - 'unexpected key "queue" for "concurrency" section'
  .github/workflows/issue-investigator-review.lock.yml:
    ignore:
      # Both findings are emitted from gh-aw generated code, not the source
      # workflow. Keep the exceptions scoped to the generated lock file.
      - 'shellcheck reported issue in this script: SC2016'
      - 'unexpected key "queue" for "concurrency" section'
  .github/workflows/maintenance-*.lock.yml:
    ignore:
      # gh-aw v0.80.9 emits both constructs in generated safe-output plumbing.
      # Keep the exceptions scoped to the generated maintenance lock files.
      - 'shellcheck reported issue in this script: SC2016'
      - 'unexpected key "queue" for "concurrency" section'
  .github/workflows/package-update-radar.lock.yml:
    ignore:
      # Same gh-aw v0.80.9 generated safe-output plumbing as the maintenance
      # locks. Keep the exceptions scoped to the generated lock file.
      - 'shellcheck reported issue in this script: SC2016'
      - 'unexpected key "queue" for "concurrency" section'
