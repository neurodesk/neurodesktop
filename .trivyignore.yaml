    expired_at: 2027-01-19
    statement: >-
      Out-of-bounds access in the kernel KVM MMU page walker. linux-libc-dev
      only installs kernel headers; containers run the host kernel, so the
      image ships none of the affected virtualization code.
  - id: CVE-2026-99344
    purls:
      - pkg:deb/ubuntu/linux-libc-dev@7.0.0-44.44
    expired_at: 2027-01-19
    statement: >-
