  # Both architectures in Build neurodesktop run 39464164441 reported these
  # kernel-source findings against the UAPI header package. Reassess by expiry.
  - id: CVE-2026-89530
    purls:
      - pkg:deb/ubuntu/linux-libc-dev@7.0.0-38.38
    expired_at: 2026-11-20
    statement: >-
      linux-libc-dev contains UAPI headers, without the affected kernel
      implementation. CVMFS requires it through uuid-dev and libc6-dev on
      Ubuntu 26.04. Containers use the host kernel, which needs separate
      security updates. This exception covers only the assessed header version.
